name: infinite-canvas
services:
  backend:
    image: infinite-canvas-backend:local
    build:
      context: .
      target: ${BACKEND_IMAGE_TARGET:-backend}
    environment:
      INFINITE_CANVAS_BACKEND_TOKEN: ${INFINITE_CANVAS_BACKEND_TOKEN:-}
      INFINITE_CANVAS_ORIGINS: ${APP_ORIGIN:-http://localhost:3000},http://localhost:3000,http://127.0.0.1:3000
      COMFYUI_URL: ${COMFYUI_URL:-http://host.docker.internal:8188}
      CHATGPT_IMAGE_API_URL: ${CHATGPT_IMAGE_API_URL:-http://host.docker.internal:8000}
      CHATGPT_IMAGE_AUTH_KEY: ${CHATGPT_IMAGE_AUTH_KEY:-chatgpt2api}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - canvas-data:/data
    restart: unless-stopped
  app:
    image: infinite-canvas-web:local
    build:
      context: .
      target: app
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-3000}:3000"
    environment:
      ANALYTICS_GA4_ID: ${ANALYTICS_GA4_ID:-}
      ANALYTICS_BAIDU_ID: ${ANALYTICS_BAIDU_ID:-}
    depends_on:
      - backend
    restart: unless-stopped
volumes:
  canvas-data:
