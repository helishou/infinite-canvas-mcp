map $http_upgrade $canvas_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /config.js {
        add_header Cache-Control "no-store";
    }

    # Strip /api/ only. /canvas is a browser route; its API is /api/canvas/.
    location /api/ {
        resolver 127.0.0.11;
        set $canvas_backend http://backend:17370;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $canvas_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $canvas_connection_upgrade;
        proxy_buffering off;
        proxy_cache off;
        # Backend owns request validation and upload limits; avoid a second nginx size cap.
        client_max_body_size 0;
        # Some requests carry tokens in URLs; do not copy them to access logs.
        access_log off;
    }
}
