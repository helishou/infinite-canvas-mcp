name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - name: Configure isolated test directories
        run: |
          echo "INFINITE_CANVAS_DATA_DIR=$RUNNER_TEMP/canvas-unit-data" >> "$GITHUB_ENV"
          echo "INFINITE_CANVAS_MEDIA_DIR=$RUNNER_TEMP/canvas-unit-media" >> "$GITHUB_ENV"
          echo "INFINITE_CANVAS_AGENT_CONFIG_DIR=$RUNNER_TEMP/canvas-unit-agent" >> "$GITHUB_ENV"
          echo "CODEX_HOME=$RUNNER_TEMP/canvas-unit-codex" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pnpm --filter @basketikun/canvas-agent run build
      - name: Build pinned Acheng test runtime
        run: pnpm run acheng:vendor
      - run: pnpm --filter infinite-canvas run typecheck
      - run: pnpm --filter @helishou/infinite-canvas-backend run build
      - name: Build Web
        run: bash .github/scripts/check-with-diagnostics.sh pnpm --filter infinite-canvas run build
      - run: pnpm --filter canvas-plugin-minimax-h3 run typecheck
      - run: pnpm --filter canvas-plugin-minimax-h3 run test
      - name: Test Backend
        run: bash .github/scripts/check-with-diagnostics.sh pnpm --filter @helishou/infinite-canvas-backend run test
      - name: Test Canvas Agent
        run: bash .github/scripts/check-with-diagnostics.sh pnpm --filter @basketikun/canvas-agent run test
      - name: Test Web
        run: bash .github/scripts/check-with-diagnostics.sh pnpm --filter infinite-canvas run test
      - run: pnpm exec playwright install --with-deps chromium
      - run: node scripts/run-canvas-browser-tests.mjs collaboration
      - run: node scripts/run-canvas-browser-tests.mjs usability
      - run: node scripts/run-canvas-browser-tests.mjs h3-output-preview
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-evidence
          path: artifacts/browser-tests
